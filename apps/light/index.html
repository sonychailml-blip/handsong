<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<!-- PRIV1 (hard rule #33): the browser itself refuses any address not listed here. connect-src/script-src name only our own origin (CORE-22:
     MediaPipe's pinned files are served from it too, core/vendor/mediapipe/; register tools/licences.json); the Vercel counter is same-origin. No inline script (the counter's stub is
     core/va-stub.js); 'wasm-unsafe-eval' lets the hand model's WebAssembly compile; inline style attributes stay allowed. A new host needs
     the user's decision, a register entry and a line here. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<!-- CORE-11: this app's own names in the shared stores (core/storens.js): on one origin with Full or Night it never reads their settings -->
<meta name="handsong-store" content="light">
<title data-i18n="light.title">Handsong</title>
<!-- PWA: start_url/scope relative in the manifest; iOS reads the apple-* tags for «Add to Home Screen» -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#120f0c">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Handsong">
<meta name="application-name" content="Handsong">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="handsong-profile" href="data/light.json">
<!-- read only under ?probe; the shipped build removes this tag and the tools it names -->
<link rel="handsong-probes" href="../../tools/probes/light.js">
<link rel="stylesheet" href="../../core/tokens.css">
<link rel="stylesheet" href="light.css">
<!-- Vercel Web Analytics, the static form (same origin; counts only on the Vercel deployment) -->
<script src="../../core/va-stub.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="light">
<!-- LIGHT-3 (option B): only Light's own elements — the start, the bars, «How to play», the camera's video and the canvas. No markup of Full. -->
<div id="start" class="on">
  <div class="light-start">
    <span class="light-emblem" data-svg="emblem" aria-hidden="true"></span>
    <h1 class="light-word">hand<span>·</span>song</h1>
    <p class="light-tag" data-i18n="light.tag">Play music with your hands, in front of the camera.</p>
    <button id="startBtn" class="light-go" data-i18n="light.play">Play</button>
    <p id="loadmsg" class="light-msg"></p>
    <button id="camRetry" class="light-retry" data-i18n="start.retry" hidden>Try again</button>
    <button id="lightHowBtn" class="light-how-btn" data-i18n="light.how">How to play</button>
    <!-- LIGHT-9: the language by hand (lang.js fills the endonyms) and the feedback form (a link the person opens; register entry link-feedback-form) -->
    <div class="light-foot">
      <label class="light-lang"><span class="light-lang-ico" data-svg="globe" aria-hidden="true"></span><span id="lightLangName" class="light-lang-name" aria-hidden="true"></span><select id="lightLang" aria-label="Language"></select></label>
      <a id="lightFeedback" class="light-fb" href="https://docs.google.com/forms/d/e/1FAIpQLScnVgevwYbUNMUAs1U5vm0DhWyHG2bBAUEGY7tXSqjaLvS2QQ/viewform" target="_blank" rel="noopener" data-i18n="light.feedback">Write to us</a>
    </div>
  </div>
</div>
<div id="lightFxBars" class="light-bars" aria-hidden="true">
  <div class="light-bar" data-bar="dly"><span class="light-bar-track"><span class="light-bar-fill"></span></span><span class="light-bar-lab">DLY</span></div>
  <div class="light-bar" data-bar="vib"><span class="light-bar-track"><span class="light-bar-fill"></span></span><span class="light-bar-lab">VIB</span></div>
  <div class="light-bar" data-bar="trm"><span class="light-bar-track"><span class="light-bar-fill"></span></span><span class="light-bar-lab">TRM</span></div>
  <div class="light-bar" data-bar="bright"><span class="light-bar-track"><span class="light-bar-fill"></span></span><span class="light-bar-lab">BRT</span></div>
</div>
<div id="lightRevBar" class="light-bars light-bars-rev" aria-hidden="true">
  <div class="light-bar"><span class="light-bar-track"><span class="light-bar-fill"></span></span><span class="light-bar-lab">REV</span></div>
</div>
<!-- LIGHT-6c: the second hand's REV, when both hands play notes (each hand its own reverb) -->
<div id="lightRevBar2" class="light-bars light-bars-rev" aria-hidden="true">
  <div class="light-bar"><span class="light-bar-track"><span class="light-bar-fill"></span></span><span class="light-bar-lab">REV</span></div>
</div>
<!-- LIGHT-3b: the controls when the hands leave (variant B, the founder's choice): the key and A4 large on top, the scale under it; four round
     buttons below (sound, hands, camera, sensitivity). apps/light/controls.js shows them and fills the sheets. -->
<div id="lightCtl" class="light-ctl" aria-hidden="true">
  <div class="light-title">
    <button id="lightKeyBtn" class="light-keybtn"><span id="lightKeyName">A</span><sup id="lightKeyHz">440</sup></button>
    <button id="lightScaleBtn" class="light-scalebtn"><span id="lightScaleName"></span><span class="light-chev" data-svg="chev-down" aria-hidden="true"></span></button>
  </div>
  <div class="light-rounds">
    <button id="lightTimbreBtn" class="light-rd"><span class="light-rd-c" data-svg="timbre" aria-hidden="true"></span><span id="lightTimbreName" class="light-rd-l"></span></button>
    <button id="lightHandsBtn" class="light-rd"><span class="light-rd-c" data-svg="hands" aria-hidden="true"></span><span class="light-rd-l" data-i18n="light.hands">Hands</span></button>
    <button id="lightCamBtn" class="light-rd"><span class="light-rd-c" data-svg="camera-flip" aria-hidden="true"></span><span class="light-rd-l" data-i18n="light.camera">Camera</span></button>
    <button id="lightSensBtn" class="light-rd"><span class="light-rd-c" data-svg="sliders" aria-hidden="true"></span><span class="light-rd-l" data-i18n="light.sens">Sensitivity</span></button>
  </div>
  <p id="lightCtlTip" class="light-tip" hidden></p>
  <button id="lightFsBtn" class="light-fsbtn" data-svg="fs-enter" data-i18n-title="light.fs.enter" title="Full screen" aria-label="Full screen" aria-pressed="false" hidden></button>
</div>
<!-- LIGHT-5: the clip (apps/light/clip.js) — the button top right (shown with the controls, and always while recording), the countdown, the card -->
<button id="lightRecBtn" class="light-recbtn" data-i18n-title="light.clip.rec" title="Record a clip" aria-label="Record a clip">
  <svg class="light-rec-ring" viewBox="0 0 54 54" aria-hidden="true"><circle cx="27" cy="27" r="25" class="light-rec-track"/><circle id="lightRecArc" cx="27" cy="27" r="25" class="light-rec-arc" stroke-dasharray="157.08" stroke-dashoffset="157.08"/></svg>
  <span id="lightRecIco" class="light-rec-ico" data-svg="clip-rec" aria-hidden="true"></span><span id="lightRecSec" class="light-rec-sec"></span>
</button>
<p id="lightRecTip" class="light-rectip" hidden></p>
<div id="lightCount" class="light-count" hidden aria-live="assertive">
  <svg viewBox="0 0 180 180" aria-hidden="true"><circle cx="90" cy="90" r="80" class="light-rec-track"/><circle id="lightCountArc" cx="90" cy="90" r="80" class="light-rec-arc" stroke-dasharray="502.65" stroke-dashoffset="0"/></svg>
  <span id="lightCountN" role="timer">3</span>
</div>
<div id="lightClipVeil" class="light-sheetveil" hidden></div>
<div id="lightClip" class="light-clipcard" role="dialog" aria-modal="true" aria-labelledby="lightClipTitle" hidden>
  <h3 id="lightClipTitle" data-i18n="light.clip.title">Your clip</h3>
  <div class="light-clip-view"><video id="lightClipVideo" playsinline loop preload="auto"></video><button id="lightClipMute" class="light-clip-mute" data-svg="speaker-on" title="Sound off"></button></div>
  <p id="lightClipSaved" class="light-clip-saved" hidden><span data-svg="saved" aria-hidden="true"></span><span data-i18n="light.clip.saved">Saved to Downloads on this device</span></p>
  <div class="light-clip-btns"><button id="lightClipShare" class="light-cal-go"><span data-i18n="light.clip.share">Share</span></button><button id="lightClipDone" data-i18n="light.clip.done">Done</button></div>
</div>
<div id="lightSheetVeil" class="light-sheetveil" hidden></div>
<div id="lightSheet" class="light-sheet" role="dialog" aria-modal="true" aria-labelledby="lightSheetTitle" hidden>
  <div class="light-sheet-grab"></div>
  <div class="light-sheet-head"><h3 id="lightSheetTitle"></h3><button id="lightSheetClose" class="light-x" data-i18n-title="light.close" title="Close"><span data-svg="close" aria-hidden="true"></span></button></div>
  <div id="lightSheetBody" class="light-sheet-body"></div>
</div>
<!-- LIGHT-4: the hand setup (apps/light/calib.js): the offer, the measure (a dashed frame, one line, the progress), done, failed -->
<div id="lightCal" class="light-cal" hidden>
  <div id="lightCalFrame" class="light-cal-frame" hidden></div>
  <div class="light-cal-card" role="dialog" aria-modal="true" aria-labelledby="lightCalTitle">
    <h4 id="lightCalTitle"></h4>
    <p id="lightCalText"></p>
    <div class="light-cal-prog" hidden><b id="lightCalProg"></b></div>
    <div class="light-cal-btns"><button id="lightCalNo" class="light-cal-no"></button><button id="lightCalGo" class="light-cal-go"></button></div>
  </div>
</div>
<!-- LIGHT-5b: the teaching cards (apps/light/cards.js), as in Night: five short cards with drawn pictures; from «How to play» and once after the first start -->
<div id="lightCards" class="light-how" role="dialog" aria-modal="true" aria-labelledby="lightCardTitle" hidden>
  <div class="light-how-card light-cards">
    <div id="lightCardPic" class="light-card-pic" aria-hidden="true"></div>
    <h2 id="lightCardTitle"></h2>
    <p id="lightCardText"></p>
    <p id="lightCardPriv" class="light-priv" data-i18n="light.privacy" hidden>Your camera picture never leaves this device. Nothing is sent anywhere.</p>
    <div class="light-cards-foot"><span id="lightCardDots" class="light-cards-dots" aria-hidden="true"></span><span id="lightCardStep" class="light-cards-step"></span></div>
    <div class="light-cal-btns"><button id="lightCardSkip"></button><button id="lightCardNext" class="light-cal-go"></button></div>
  </div>
</div>
<video id="video" playsinline muted autoplay></video>
<canvas id="canvas"></canvas>
<script type="module" src="main.js"></script>
</body>
</html>
