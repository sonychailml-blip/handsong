<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- CORE-1 CP1: the guided hand measuring page, a dev tool that needs no console. Previews carry it, production never does (tools/build.mjs).
     Local: http://127.0.0.1:5500/tools/probes/core/handstats.html   Preview: <preview address>/tools/probes/core/handstats.html -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@mediapipe/ 'wasm-unsafe-eval'; connect-src 'self' https://cdn.jsdelivr.net/npm/@mediapipe/ https://storage.googleapis.com/mediapipe-models/; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand measuring</title>
<style>
  :root{ --bg:#07090d; --panel:#11151d; --ink:#f1eee4; --dim:#a4acba; --accent:#c8f56a; --line:#2a3240; --warn:#ffb86b; color-scheme:dark; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font:18px/1.4 system-ui, sans-serif; }
  main{ max-width:560px; margin:0 auto; padding:16px 16px 40px; display:flex; flex-direction:column; gap:14px; }
  h1{ font-size:24px; font-weight:600; margin:0; }
  .ru{ font-size:21px; font-weight:600; }
  .en{ color:var(--dim); font-size:17px; }
  #say p{ margin:0 0 4px; }
  #step{ color:var(--dim); font-size:15px; min-height:20px; }
  #note{ color:var(--warn); min-height:24px; }
  video{ width:100%; max-height:38vh; object-fit:contain; background:#000; border-radius:12px; transform:scaleX(-1); }
  video[hidden], textarea[hidden], button[hidden], #bar[hidden]{ display:none; }
  button{ width:100%; min-height:72px; background:var(--accent); color:#10140a; border:0; border-radius:14px; font:600 21px/1.2 system-ui, sans-serif; padding:10px 14px; cursor:pointer; }
  button small{ display:block; font-weight:500; font-size:15px; }
  button.quiet{ background:var(--panel); color:var(--ink); border:1px solid var(--line); min-height:60px; }
  button:disabled{ opacity:0.45; }
  #bar{ height:18px; background:var(--panel); border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  #fill{ height:100%; width:0; background:var(--accent); }
  textarea{ width:100%; height:32vh; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px; font:12px/1.35 ui-monospace, monospace; }
</style>
</head>
<body>
<main>
  <h1>Hand measuring</h1>
  <div id="step"></div>
  <div id="say"></div>
  <video id="video" playsinline muted hidden></video>
  <div id="bar" hidden><div id="fill"></div></div>
  <div id="note"></div>
  <button id="go"></button>
  <button id="again" class="quiet" hidden></button>
  <textarea id="out" readonly hidden></textarea>
</main>
<script type="module" src="handstats.js"></script>
</body>
</html>
