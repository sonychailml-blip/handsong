<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Тихие комнаты</title><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300;400;500&display=swap">
<style>
/* Full-bleed painted spaces (one WebGL canvas), a small glass panel, a film layer. A single deliberate dark look. */
:root{
  --night:#030508;
  --ink:#e4ebe8;
  --ink-dim:#97a3a0;
  --accent:#9fe3ff;
  --glass:rgba(8,12,16,.52);
  --hair:rgba(228,235,232,.14);
  --font:"Commissioner","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--font);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:none;opacity:0;transition:opacity .9s ease}
canvas#view.on{opacity:1}
.grain{position:fixed;inset:-50%;pointer-events:none;z-index:1;opacity:.06;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain .9s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.panel{position:fixed;z-index:3;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:9px;padding:12px 14px;max-width:min(360px,calc(100% - 32px));
  background:var(--glass);border:1px solid var(--hair);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim)}
h1{margin:0;font-weight:300;font-size:21px;letter-spacing:.01em}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lab{font-size:11px;color:var(--ink-dim);min-width:66px}
button{font:inherit;font-size:12.5px;color:var(--ink);background:transparent;border:1px solid var(--hair);border-radius:999px;padding:6px 11px;cursor:pointer;transition:border-color .2s,color .2s,background .2s}
button:hover{border-color:var(--ink-dim)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
button.sound{background:var(--accent);border-color:var(--accent);color:#06121a;font-weight:500}
button.sound[aria-pressed="true"]{background:transparent;color:var(--accent)}
.fold{font-size:11px;color:var(--ink-dim);background:none;border:none;padding:0;cursor:pointer}
.panel.min .more{display:none}
.hint{position:fixed;z-index:3;left:0;right:0;top:calc(16px + env(safe-area-inset-top,0px));text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-size:13px;color:var(--ink-dim);pointer-events:none;text-wrap:balance;transition:opacity 1.2s}
.hint.gone{opacity:0}
.err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-dim);z-index:4}
@media (max-width:520px){h1{font-size:18px}.lab{min-width:0;width:100%}}
</style>

<canvas id="view" aria-label="Тихое пространство: огонёк следует за курсором или пальцем, нажатие играет ноту."></canvas>
<div class="grain"></div>
<div class="hint" id="hint"></div>
<div class="panel" id="panel" role="group" aria-label="Тихие комнаты">
  <div class="eyebrow">Handsong · Calm · эскизы</div>
  <h1>Тихие комнаты</h1>
  <div class="row" role="group" aria-label="Пространство">
    <button data-s="lake" aria-pressed="true">Озеро</button><button data-s="aurora" aria-pressed="false">Сияние</button><button data-s="sea" aria-pressed="false">Море</button><button data-s="window" aria-pressed="false">Окно</button>
  </div>
  <div class="more"><div class="row"><span class="lab">Качество</span>
    <button data-q="low" aria-pressed="false">Низкое</button><button data-q="mid" aria-pressed="true">Среднее</button><button data-q="high" aria-pressed="false">Высокое</button></div></div>
  <div class="row"><button id="snd" class="sound" aria-pressed="false">Включить звук</button><button class="fold" id="fold">Свернуть</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const cv=document.getElementById('view'),hintEl=document.getElementById('hint');
const fail=m=>{const d=document.createElement('div');d.className='err';d.textContent=m;document.body.appendChild(d)};
if(!window.THREE){fail('Не удалось загрузить 3D-движок. Обновите страницу.');return}
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:cv,antialias:false,powerPreference:'high-performance'})}catch(e){fail('Этот браузер не поддерживает WebGL.');return}
renderer.autoClear=false;
const small=Math.min(innerWidth,innerHeight)<600,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const QUAL={low:.45,mid:.65,high:.85};let qual=small?'low':'mid';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(1020);

/* ---------------- full-screen passes ---------------- */
const quadCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1),quadScene=new THREE.Scene(),quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2));quad.frustumCulled=false;quadScene.add(quad);
function pass(mat,target){quad.material=mat;renderer.setRenderTarget(target||null);renderer.render(quadScene,quadCam)}
const QV=`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`;
/* shared GLSL: hashes, value noise, fractal noise, a filmic curve, a camera ray */
const G=`
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
vec2 h22(vec2 p){float n=h21(p);return vec2(n,h21(p+n*19.19+7.3));}
float h11(float x){return h21(vec2(x,x*1.731+4.3));}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*vnoise(p);p=p*2.02+vec2(1.7,9.2);a*=.5;}return s;}
float fbm3(vec2 p){float a=.5,s=0.;for(int i=0;i<3;i++){s+=a*vnoise(p);p=p*2.03+vec2(4.1,1.3);a*=.5;}return s;}
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
vec3 outCol(vec3 c){return pow(aces(c),vec3(1./2.2));}
vec3 camRay(vec2 uv,float asp,float fovy,float pitch){vec2 s=(uv-.5)*vec2(asp,1.)*2.*tan(fovy*.5);vec3 r=normalize(vec3(s,-1.));float c=cos(pitch),sn=sin(pitch);return vec3(r.x,r.y*c-r.z*sn,r.y*sn+r.z*c);}
float capsule(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/max(dot(ba,ba),1e-7),0.,1.);return length(pa-ba*h);}
`;
const mat=(frag,uniforms)=>new THREE.ShaderMaterial({uniforms,vertexShader:QV,fragmentShader:G+frag,depthTest:false,depthWrite:false,toneMapped:false});
const rt=(w,h,o={})=>new THREE.WebGLRenderTarget(w,h,Object.assign({depthBuffer:false,stencilBuffer:false,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter},o));
/* project a world point with the same camera the shaders use */
function project(p,ro,fovy,pitch,asp){const vx=p.x-ro.x,vy=p.y-ro.y,vz=p.z-ro.z,c=Math.cos(pitch),s=Math.sin(pitch);
  const y=vy*c+vz*s,z=-vy*s+vz*c;if(z>-.05)return null;const th=Math.tan(fovy/2);return{x:vx/(-z)/(2*th*asp)+.5,y:y/(-z)/(2*th)+.5,k:1/(-z)/(2*th)}}
function rayDir(u,v,asp,fovy,pitch){const th=Math.tan(fovy/2);let x=(u-.5)*asp*2*th,y=(v-.5)*2*th,z=-1;const l=Math.hypot(x,y,z);x/=l;y/=l;z/=l;const c=Math.cos(pitch),s=Math.sin(pitch);return{x,y:y*c-z*s,z:y*s+z*c}}

/* ---------------- input: a pointer is a hand ---------------- */
const inp={u:.5,v:.45,pu:.5,pv:.45,on:0,want:0,last:-1e9,down:false,downAt:-1};
const toUV=e=>{inp.u=e.clientX/innerWidth;inp.v=1-e.clientY/innerHeight};
cv.addEventListener('pointermove',e=>{toUV(e);inp.want=1;inp.last=performance.now();hintEl.classList.add('gone')});
cv.addEventListener('pointerdown',e=>{toUV(e);inp.pu=inp.u;inp.pv=inp.v;inp.want=1;inp.on=Math.max(inp.on,.6);inp.last=performance.now();inp.down=true;cv.setPointerCapture?.(e.pointerId);if(cur)cur.note(inp.u,inp.v);playNote();hintEl.classList.add('gone')});
const up=()=>{inp.down=false};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){inp.want=0;inp.down=false}});

/* =====================================================================
   1. THE WINDOW — a rainy night outside, the glass fogged; the finger wipes it clear
   ===================================================================== */
function WindowScene(){
  const BG=mat(`uniform float uTime,uAsp;varying vec2 vUv;
  vec3 bokeh(vec2 p,vec2 c,float r,vec3 col){float d=length(p-c)/r;float disc=smoothstep(1.,.9,d)*(.75+.25*smoothstep(.5,1.,d));return col*(disc+.16*exp(-d*d*1.4));}
  void main(){vec2 p=vec2(vUv.x*uAsp-(uAsp-1.6)*.5,vUv.y);float y=p.y,t=uTime;
    vec3 col=mix(vec3(.010,.010,.018),vec3(.014,.020,.042),smoothstep(.35,1.,y));
    col+=vec3(.26,.11,.045)*exp(-pow((y-.52)/.16,2.))*.6;
    // houses across the street, their windows
    float bx=p.x*5.2+.3,bi=floor(bx),bh=.56+.2*h11(bi)+.07*h11(bi*3.1+2.);
    float roof=bh+.05*(1.-abs(fract(bx)-.5)*2.)*step(.5,h11(bi+9.));
    float inB=smoothstep(roof+.004,roof-.004,y)*step(.33,y);
    col=mix(col,vec3(.006,.006,.01),inB*.92);
    vec2 wg=vec2(p.x*34.,y*26.),wi=floor(wg),wf=fract(wg);
    float lit=step(.7,h21(wi+bi*13.))*inB*step(y,roof-.035)*step(.37,y);
    vec3 wc=mix(vec3(1.,.58,.24),vec3(1.,.78,.5),h21(wi*3.3));wc=mix(wc,vec3(.75,.85,1.),step(.9,h21(wi*1.7+2.)));
    float tv=step(.94,h21(wi*2.3));wc=mix(wc,vec3(.45,.6,1.)*(.55+.45*sin(t*6.+wi.x*3.)),tv);
    col+=wc*lit*smoothstep(.5,.2,length((wf-.5)*vec2(1.,1.2)))*.95;
    // a little shop with a neon sign
    vec2 ns=p-vec2(.384,.425);col+=vec3(.12,.95,.85)*smoothstep(.065,.055,abs(ns.x))*smoothstep(.016,.01,abs(ns.y))*.9+vec3(.12,.95,.85)*.07*exp(-dot(ns,ns)*80.);
    vec2 n2=p-vec2(.384,.462);col+=vec3(1.,.25,.55)*smoothstep(.036,.03,abs(n2.x))*smoothstep(.008,.005,abs(n2.y))*.8;
    vec2 sh=p-vec2(.384,.37);col+=vec3(1.,.72,.42)*smoothstep(.07,.05,abs(sh.x))*smoothstep(.035,.025,abs(sh.y))*.22;
    // street lamps and their reflections on the wet street
    float li=floor(p.x/.286-.35+.5);for(int i=-1;i<=1;i++){float fi=li+float(i);vec2 c=vec2((fi+.35)*.286,.64+.015*sin(fi*2.1));vec3 lc=vec3(1.,.6,.28)*(.96+.04*sin(t*(1.3+fi)));
      col+=bokeh(p,c,.075,lc)*1.25;
      if(y<.31){float dx=p.x-c.x;col+=lc*exp(-dx*dx/(.0005+.006*(.31-y)))*smoothstep(.31,.0,y)*.32*(.5+.5*vnoise(vec2(p.x*90.,y*16.-t*2.5)));}}
    float si=floor(p.x/.178);for(int i=-1;i<=1;i++){float fi=si+float(i);vec2 c=vec2((fi+.5)*.178+.03*sin(fi*5.),.585+.01*sin(fi*1.3));col+=bokeh(p,c,.03,vec3(1.,.66,.34))*.55;}
    // a traffic light
    {vec2 c=vec2(1.28,.55);float ph=mod(t,24.);vec3 tl=ph<10.?vec3(.25,1.,.55):ph<13.?vec3(1.,.7,.15):vec3(1.,.15,.12);col+=bokeh(p,c,.024,tl)*.9;
     float dx=p.x-c.x;col+=tl*exp(-dx*dx/.0008)*smoothstep(.31,.0,y)*step(y,.31)*.22*(.5+.5*vnoise(vec2(p.x*80.,y*15.-t*2.)));}
    // cars: headlights one way, tail lights the other
    for(int i=0;i<4;i++){float fi=float(i),sp=.05+.025*h11(fi),x=mod(-t*sp+fi*.95+h11(fi+3.)*2.,2.72)-.56;vec3 hc=vec3(1.,.92,.78);
      col+=(bokeh(p,vec2(x,.335),.03,hc)+bokeh(p,vec2(x+.062,.335),.03,hc))*1.;float dx=p.x-x-.023;col+=hc*exp(-dx*dx/.003)*smoothstep(.32,.0,y)*step(y,.32)*.16;}
    for(int i=0;i<3;i++){float fi=float(i),sp=.04+.02*h11(fi+5.),x=mod(t*sp+fi*1.2+h11(fi+7.)*2.,2.72)-.56;vec3 rc=vec3(1.,.1,.06);
      col+=(bokeh(p,vec2(x,.357),.022,rc)+bokeh(p,vec2(x+.05,.357),.022,rc))*.9;float dx=p.x-x-.018;col+=rc*exp(-dx*dx/.002)*smoothstep(.33,.0,y)*step(y,.33)*.14;}
    col=mix(col,col*.65+vec3(.008,.01,.016),step(y,.31)*.35);
    // rain falling through the lamplight
    float cx=floor(p.x*170.);float rs=step(.965,h21(vec2(cx,floor(y*5.-t*8.5+h21(vec2(cx,3.))*20.))));col+=vec3(.9,.75,.55)*rs*.025*smoothstep(.25,.7,y);
    // a big blurred branch outside
    float br=smoothstep(.56,.66,fbm3(p*vec2(3.,5.)+vec2(0.,t*.015)))*smoothstep(.6,1.,y)*smoothstep(.72,1.6,p.x);col*=1.-br*.75;
    gl_FragColor=vec4(sqrt(max(col,0.)),1.);}`,{uTime:{value:0},uAsp:{value:1}});
  // the fog on the glass: 1 = fogged, 0 = clear; the finger and the running drops clear it, it slowly comes back
  const FOGU=mat(`uniform sampler2D tPrev;uniform float uStep,uAsp,uBR,uBOn;uniform vec4 uB;uniform vec4 uTr[40];uniform float uTrR[40];varying vec2 vUv;
  void main(){float f=min(1.,texture2D(tPrev,vUv).r+uStep);vec2 p=vec2(vUv.x*uAsp,vUv.y);
    if(uBOn>.5){float d=capsule(p,vec2(uB.x*uAsp,uB.y),vec2(uB.z*uAsp,uB.w));f=min(f,smoothstep(uBR*.5,uBR,d));}
    for(int i=0;i<40;i++){float r=uTrR[i];if(r<=0.)continue;vec4 t=uTr[i];float d=capsule(p,vec2(t.x*uAsp,t.y),vec2(t.z*uAsp,t.w));f=min(f,mix(.12,1.,smoothstep(r*.3,r,d)));}
    gl_FragColor=vec4(f,f,f,1.);}`,{tPrev:{value:null},uStep:{value:0},uAsp:{value:1},uBR:{value:.04},uBOn:{value:0},uB:{value:new THREE.Vector4()},uTr:{value:Array.from({length:40},()=>new THREE.Vector4())},uTrR:{value:new Array(40).fill(0)}});
  const COMP=mat(`uniform sampler2D tBg,tFog;uniform vec4 uDr[40];uniform float uTime,uAsp,uOn;uniform vec2 uHand,uFogTex;varying vec2 vUv;
  vec3 bg(vec2 uv,float b){vec3 s=texture2D(tBg,uv,b).rgb;return s*s;}
  void main(){vec2 p=vec2(vUv.x*uAsp,vUv.y);float t=uTime;
    // running drops: little lenses that show the street upside down
    float dm=0.,rim=0.;vec2 lens=vUv,hl=vec2(9.);
    for(int i=0;i<40;i++){vec4 d=uDr[i];if(d.z<=0.)continue;vec2 c=vec2(d.x*uAsp,d.y),q=p-c;float r=d.z;if(abs(q.x)>r*1.3||q.y<-r*1.3||q.y>r*4.)continue;
      vec2 qq=q;qq.y=qq.y>0.?qq.y/(1.+d.w*2.6):qq.y*1.1;qq.x*=1.+.25*smoothstep(0.,r,q.y)*d.w;float L=length(qq)/r;
      if(L<1.){dm=smoothstep(1.,.82,L);rim=smoothstep(.55,1.,L);vec2 lc=c-qq*6.5*(1.+.35*L*L);lens=vec2(lc.x/uAsp,lc.y);hl=qq/r;break;}}
    float f=texture2D(tFog,vUv).r;
    // condensation beads that live in the fog
    vec2 g=p*vec2(58.),gi=floor(g),gf=fract(g)-.5;float hb=h21(gi);float br=(.1+.27*h21(gi+3.1))*step(.5,hb)*(.7+.3*sin(t*.07+hb*30.));
    vec2 bc=(h22(gi)-.5)*.42,bq=gf-bc;float bL=length(bq)/max(br,1e-3);float bead=br>0.&&hb>.68?smoothstep(1.,.75,bL)*smoothstep(.25,.75,f):0.;
    // the glass: clear where wiped, frosted where fogged
    vec3 clear=vec3(0.);for(int k=0;k<7;k++){float a=float(k)*2.39996;vec2 o=vec2(cos(a),sin(a))*sqrt(float(k)/7.)*.006*vec2(1./uAsp,1.);clear+=bg(vUv+o,1.4);}clear/=7.;
    vec3 frost=bg(vUv,5.2)*.44+bg(vUv,7.5)*.3+vec3(.010,.011,.015)+vec3(.022,.014,.008)*(1.-vUv.y*.7);
    frost*=.9+.2*vnoise(p*700.);
    float fe=f*(1.-dm);vec3 col=mix(clear,frost,smoothstep(.0,1.,fe));
    // a wet rim where the wiped glass meets the fog
    float fx=texture2D(tFog,vUv+vec2(uFogTex.x,0.)).r-texture2D(tFog,vUv-vec2(uFogTex.x,0.)).r,fy=texture2D(tFog,vUv+vec2(0.,uFogTex.y)).r-texture2D(tFog,vUv-vec2(0.,uFogTex.y)).r;
    col+=vec3(.04,.044,.052)*clamp(length(vec2(fx,fy))*1.8,0.,1.)*(.6+.4*vnoise(p*120.));
    if(bead>0.){vec2 lc=(gi+.5+bc-bq*4.5)/58.;vec3 bv=bg(vec2(lc.x/uAsp,lc.y),1.)*1.6+frost*.35;col=mix(col,bv,bead*.6);
      col+=vec3(1.,.95,.88)*exp(-dot(bq/max(br,1e-3)-vec2(-.35,.4),bq/max(br,1e-3)-vec2(-.35,.4))*25.)*.35*bead;}
    if(dm>0.){vec3 dv=bg(lens,.6)*1.9+frost*.12;dv*=1.-rim*.4;col=mix(col,dv,dm);
      col+=vec3(1.,.95,.85)*exp(-dot(hl-vec2(-.33,.42),hl-vec2(-.33,.42))*30.)*.75*dm;col+=vec3(.6,.7,.8)*smoothstep(.75,1.,length(hl))*.04*dm;}
    // warm lamp of the room, faintly reflected in the glass
    col+=vec3(1.,.64,.34)*.028*smoothstep(1.,0.,length((vUv-vec2(.06,.08))*vec2(uAsp,1.)));
    // the fingertip: a soft warm glow on the glass
    vec2 hq=p-vec2(uHand.x*uAsp,uHand.y);col+=vec3(1.,.8,.55)*uOn*(exp(-dot(hq,hq)*9000.)*.5+exp(-dot(hq,hq)*500.)*.05);
    col*=1.-.35*smoothstep(.55,1.15,length((vUv-.5)*vec2(uAsp*.8,1.)));
    gl_FragColor=vec4(outCol(col*1.9)+(h21(gl_FragCoord.xy+t)-.5)/255.,1.);}`,
    {tBg:{value:null},tFog:{value:null},uDr:{value:Array.from({length:40},()=>new THREE.Vector4())},uTime:{value:0},uAsp:{value:1},uOn:{value:0},uHand:{value:new THREE.Vector2()},uFogTex:{value:new THREE.Vector2()}});
  let bgRT=null,fogA=null,fogB=null,acc=0;
  const drops=[];const N=34;
  const spawn=(d,top)=>{d.x=R();d.y=top?.75+R()*.35:R()*1.05;d.r=.005+R()*.006;d.slide=false;d.timer=1+R()*6;d.v=0;d.px=d.x;d.py=d.y;d.w=0;d.max=.009+R()*.01;return d};
  for(let i=0;i<N;i++)drops.push(spawn({},false));
  const extra=[];

    resize(w,h){const P2=v=>Math.min(1024,THREE.MathUtils.ceilPowerOfTwo(Math.max(128,v>>1))),bw=P2(w),bh=P2(h);

    // the hand: a small cold glint
    vec2 p=vec2(vUv.x*uAsp,vUv.y),hq=p-vec2(uHand.x*uAsp,uHand.y);
    col+=vec3(.7,1.,.85)*uOn*(exp(-dot(hq,hq)*9000.)*.7+exp(-dot(hq,hq)*500.)*.05+(exp(-abs(hq.x)*500.)*exp(-abs(hq.y)*40.)+exp(-abs(hq.y)*500.)*exp(-abs(hq.x)*40.))*.12);
    col*=1.-.3*smoothstep(.6,1.2,length((vUv-.5)*vec2(uAsp*.8,1.)));
    gl_FragColor=vec4(outCol(col*1.15)+(h21(gl_FragCoord.xy+t)-.5)/255.,1.);}`,
    {uTime:{value:0},uAsp:{value:1},uOn:{value:0},uPx:{value:1/800},uHX:{value:0},uNs:{value:20},uHand:{value:new THREE.Vector2()},uP:{value:Array.from({length:6},()=>new THREE.Vector4(0,-99,0,0))}});
  let pi=0,hx=0;const hxOf=(u,v,asp)=>{const d=rayDir(u,v,asp,FOV,PITCH);return d.x/Math.max(-d.z,.1)*30};
  return{name:'aurora',voice:'glass',scale:[0,2,5,7,9],root:59,amb:'wind',hint:'Ведите рукой по небу — сияние потянется за ней. Нажмите — по нему пробежит волна света.',
    resize(w,h){AUR.uniforms.uPx.value=1/h;AUR.uniforms.uNs.value=qual==='low'?14:qual==='mid'?20:26},
    note(u,v){const U=AUR.uniforms;U.uP.value[pi].set(hxOf(u,v,U.uAsp.value),U.uTime.value,1,0);pi=(pi+1)%6},
    update(t,dt,asp){const U=AUR.uniforms;U.uTime.value=t;U.uAsp.value=asp;U.uOn.value=inp.on;U.uHand.value.set(inp.u,inp.v);hx+=(hxOf(inp.u,inp.v,asp)-hx)*Math.min(1,dt*2.5);U.uHX.value=hx},
    render(){pass(AUR,null)}}
}

/* ---------------- sound: a voice per space, an ambience per space ---------------- */
let AC=null,master=null,verb=null,ambNode=null,surfGain=null;
function initAudio(){AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.85;const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3;master.connect(comp);comp.connect(AC.destination);
  verb=AC.createConvolver();const len=AC.sampleRate*4,ir=AC.createBuffer(2,len,AC.sampleRate);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++){const t=i/AC.sampleRate;d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4)*(t<.03?t/.03:1)*.5}}
  verb.buffer=ir;const vg=AC.createGain();vg.gain.value=.6;verb.connect(vg);vg.connect(master)}
const noiseBuf=()=>{const b=AC.createBuffer(1,AC.sampleRate*3,AC.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=w*.6+l*3}return b};
function setAmbience(kind){if(!AC)return;if(ambNode){const old=ambNode;old.g.gain.setTargetAtTime(0,AC.currentTime,.6);setTimeout(()=>{old.stop()},2500)}
  const g=AC.createGain();g.gain.value=0;g.connect(master);const nodes=[];const src=()=>{const s=AC.createBufferSource();s.buffer=noiseBuf();s.loop=true;s.start();nodes.push(s);return s};let timer=null;
  if(kind==='rain'){const s=src(),hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=700;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6500;const a=AC.createGain();a.gain.value=.06;s.connect(hp);hp.connect(lp);lp.connect(a);a.connect(g);
    const s2=src(),lp2=AC.createBiquadFilter();lp2.type='lowpass';lp2.frequency.value=260;const b=AC.createGain();b.gain.value=.05;s2.connect(lp2);lp2.connect(b);b.connect(g);
    const tick=()=>{if(!AC)return;const t=AC.currentTime,o=AC.createBufferSource();o.buffer=noiseBuf();const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1800+Math.random()*3000;bp.Q.value=4;const e=AC.createGain();
      e.gain.setValueAtTime(.0,t);e.gain.linearRampToValueAtTime(.05+Math.random()*.06,t+.002);e.gain.exponentialRampToValueAtTime(.0001,t+.03+Math.random()*.03);o.connect(bp);bp.connect(e);e.connect(g);o.start(t,Math.random()*2);o.stop(t+.08);timer=setTimeout(tick,60+Math.random()*260)};tick()}
  if(kind==='surf'){const s=src(),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;const a=AC.createGain();a.gain.value=.02;s.connect(lp);lp.connect(a);a.connect(g);surfGain={a,lp}}
  if(kind==='calm'){const s=src(),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=320;const a=AC.createGain();a.gain.value=.018;s.connect(lp);lp.connect(a);a.connect(g);
    const plip=()=>{if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),e=AC.createGain();o.frequency.setValueAtTime(1100+Math.random()*500,t);o.frequency.exponentialRampToValueAtTime(600,t+.07);e.gain.setValueAtTime(.0,t);e.gain.linearRampToValueAtTime(.02,t+.004);e.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(e);e.connect(g);e.connect(verb);o.start(t);o.stop(t+.15);timer=setTimeout(plip,2500+Math.random()*7000)};timer=setTimeout(plip,1500)}
  if(kind==='wind'){const s=src(),bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=380;bp.Q.value=.8;const a=AC.createGain();a.gain.value=.035;s.connect(bp);bp.connect(a);a.connect(g);
    const l1=AC.createOscillator(),lg1=AC.createGain();l1.frequency.value=.07;lg1.gain.value=200;l1.connect(lg1);lg1.connect(bp.frequency);l1.start();nodes.push(l1);
    const l2=AC.createOscillator(),lg2=AC.createGain();l2.frequency.value=.043;lg2.gain.value=.02;l2.connect(lg2);lg2.connect(a.gain);l2.start();nodes.push(l2);
    const sing=()=>{if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),e=AC.createGain(),f0=1400+Math.random()*1600;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f0*.18,t+.5);
      e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(.012,t+.01);e.gain.exponentialRampToValueAtTime(.0001,t+.6);o.connect(e);e.connect(g);e.connect(verb);o.start(t);o.stop(t+.65);timer=setTimeout(sing,6000+Math.random()*14000)};timer=setTimeout(sing,4000)}
  g.gain.setTargetAtTime(1,AC.currentTime,1.2);ambNode={g,stop(){clearTimeout(timer);nodes.forEach(n=>{try{n.stop()}catch(e){}});g.disconnect()}}}
function playNote(){if(!AC||!cur)return;const sc=cur.scale,idx=Math.round(clamp(inp.v,0,1)*9),m=cur.root-5+Math.floor(idx/5)*12+sc[idx%5],f=440*Math.pow(2,(m-69)/12),t=AC.currentTime,pan=AC.createStereoPanner?AC.createStereoPanner():null;
  const out=AC.createGain();out.gain.value=1;if(pan){pan.pan.value=(inp.u-.5)*.8;out.connect(pan);pan.connect(master);pan.connect(verb)}else{out.connect(master);out.connect(verb)}
  const part=(mult,amp,dec,type='sine',att=.004)=>{const o=AC.createOscillator(),e=AC.createGain();o.type=type;o.frequency.value=f*mult;e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(amp,t+att);e.gain.exponentialRampToValueAtTime(.0001,t+dec);o.connect(e);e.connect(out);o.start(t);o.stop(t+dec+.05)};
  if(cur.voice==='drop'){part(1,.16,1.6);part(3.98,.035,.35);part(7.1,.012,.12);part(2,.03,.6,'triangle')}
  if(cur.voice==='glass'){const mk=(mult,amp,det)=>{const o=AC.createOscillator(),e=AC.createGain();o.frequency.value=f*mult*(1+det);e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(amp,t+.3);e.gain.setTargetAtTime(.0001,t+.55,1.1);o.connect(e);e.connect(out);o.start(t);o.stop(t+6)};
    mk(1,.085,0);mk(1,.05,.0035);mk(2,.022,-.002);mk(3,.007,0)}
  if(cur.voice==='chime'){part(1,.12,4.2);part(2.76,.04,1.8);part(5.4,.018,.8);part(8.9,.008,.4)}
  if(cur.voice==='flute'){const o=AC.createOscillator(),e=AC.createGain(),v=AC.createOscillator(),vg=AC.createGain();o.frequency.value=f;v.frequency.value=5;vg.gain.value=f*.004;v.connect(vg);vg.connect(o.frequency);
    e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(.12,t+.14);e.gain.setTargetAtTime(.0001,t+1.1,.5);o.connect(e);e.connect(out);o.start(t);v.start(t);o.stop(t+4);v.stop(t+4);
    const n=AC.createBufferSource();n.buffer=noiseBuf();const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f*2;bp.Q.value=3;const ne=AC.createGain();ne.gain.setValueAtTime(0,t);ne.gain.linearRampToValueAtTime(.05,t+.1);ne.gain.setTargetAtTime(.0001,t+.6,.3);n.connect(bp);bp.connect(ne);ne.connect(out);n.start(t);n.stop(t+3);part(2,.025,1.6)}}

/* ---------------- the frame loop and the panel ---------------- */
const scenes={window:WindowScene(),sea:SeaScene(),lake:LakeScene(),aurora:AuroraScene()};let cur=null,clock=0,prev=performance.now(),paused=false;
function size(){renderer.setPixelRatio(Math.min(devicePixelRatio,2)*QUAL[qual]);renderer.setSize(innerWidth,innerHeight,false);const v=new THREE.Vector2();renderer.getDrawingBufferSize(v);Object.values(scenes).forEach(s=>s.resize(v.x,v.y))}
function setScene(name){const go=()=>{cur=scenes[name];hintEl.textContent=cur.hint;hintEl.classList.remove('gone');setAmbience(cur.amb);
    document.querySelectorAll('[data-s]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===name));cv.classList.add('on')};
  if(cur){cv.classList.remove('on');setTimeout(go,450)}else go()}
function frame(now){const dt=Math.min(.05,(now-prev)/1000);prev=now;clock+=dt*(reduce?.6:1);
  if(performance.now()-inp.last>5000&&!inp.down)inp.want=0;inp.on+=(inp.want-inp.on)*Math.min(1,dt*4);
  const asp=innerWidth/innerHeight;if(cur){cur.update(clock,dt,asp);cur.render();
    if(AC&&surfGain&&cur.phase){const ph=cur.phase(clock);surfGain.a.gain.setTargetAtTime(.012+.07*Math.pow(Math.max(0,ph),2.5),AC.currentTime,.25);surfGain.lp.frequency.setTargetAtTime(500+900*Math.max(0,ph),AC.currentTime,.3)}}
  inp.pu=inp.u;inp.pv=inp.v;if(!paused)requestAnimationFrame(frame)}
document.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{if(cur&&cur.name===b.dataset.s)return;setScene(b.dataset.s)}));
document.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{qual=b.dataset.q;document.querySelectorAll('[data-q]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.q===qual));size()}));
document.querySelectorAll('[data-q]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.q===qual));
const snd=document.getElementById('snd');snd.addEventListener('click',()=>{if(!AC){initAudio();setAmbience(cur.amb);snd.textContent='Звук: вкл';snd.setAttribute('aria-pressed','true')}
  else if(AC.state==='running'){AC.suspend();snd.textContent='Звук: выкл';snd.setAttribute('aria-pressed','false')}else{AC.resume();snd.textContent='Звук: вкл';snd.setAttribute('aria-pressed','true')}});
const panel=document.getElementById('panel'),fold=document.getElementById('fold');if(small){panel.classList.add('min');fold.textContent='Настройки'}
fold.addEventListener('click',()=>{panel.classList.toggle('min');fold.textContent=panel.classList.contains('min')?'Настройки':'Свернуть'});
addEventListener('resize',size);size();setScene('lake');
requestAnimationFrame(t=>{prev=t;frame(t)});
window.__spaces={scenes,inp,set:n=>{cur=scenes[n];cv.classList.add('on');document.querySelectorAll('[data-s]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===n))},pause:v=>{paused=v;if(!v)requestAnimationFrame(t=>{prev=t;frame(t)})},
  step:(n,dt=.033)=>{for(let i=0;i<n;i++){clock+=dt;const asp=innerWidth/innerHeight;cur.update(clock,dt,asp);cur.render();inp.pu=inp.u;inp.pv=inp.v}},setT:v=>{clock=v},hand:(u,v)=>{inp.u=u;inp.v=v;inp.on=1;inp.want=1;inp.last=performance.now()+1e9},note:(u,v)=>cur.note(u,v)};
})();
</script>
