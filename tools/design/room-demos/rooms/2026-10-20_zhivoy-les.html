<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Живой лес</title><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300;400;500&display=swap">
<style>
/* One full-bleed 3D view of a night forest, a small glass panel, a film layer (vignette + grain). A single deliberate dark look. */
:root{
  --night:#03060a;
  --ink:#dfe8e2;
  --ink-dim:#93a39b;
  --lime:#c9f27a;
  --glass:rgba(8,14,16,.55);
  --hair:rgba(223,232,226,.14);
  --font:"Commissioner","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--font);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:none;opacity:0;transition:opacity 2.4s ease}
canvas#view.awake{opacity:1}
.film{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse 75% 70% at 50% 46%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
.grain{position:fixed;inset:-50%;pointer-events:none;z-index:1;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain .9s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.wake{position:fixed;inset:0;z-index:2;display:grid;place-items:center;pointer-events:none;text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-weight:300;font-size:15px;letter-spacing:.08em;color:var(--ink-dim);transition:opacity 1.6s ease}
.wake.gone{opacity:0}
.wake span{animation:breath 2.4s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:.45}50%{opacity:1}}
.panel{position:fixed;z-index:3;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:9px;padding:12px 14px;max-width:min(340px,calc(100% - 32px));
  background:var(--glass);border:1px solid var(--hair);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim)}
h1{margin:0;font-weight:300;font-size:21px;letter-spacing:.01em}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lab{font-size:11px;color:var(--ink-dim);min-width:74px}
button{font:inherit;font-size:12.5px;color:var(--ink);background:transparent;border:1px solid var(--hair);border-radius:999px;padding:6px 11px;cursor:pointer;transition:border-color .2s,color .2s,background .2s}
button:hover{border-color:var(--ink-dim)}
button:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--lime);color:var(--lime)}
button.sound{background:var(--lime);border-color:var(--lime);color:#0a120a;font-weight:500}
button.sound[aria-pressed="true"]{background:transparent;color:var(--lime)}
.fold{font-size:11px;color:var(--ink-dim);background:none;border:none;padding:0;text-align:left;cursor:pointer}
.panel.min .more{display:none}
.hint{position:fixed;z-index:3;left:0;right:0;top:calc(16px + env(safe-area-inset-top,0px));text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-size:13px;color:var(--ink-dim);pointer-events:none;text-wrap:balance;transition:opacity 1.2s}
.hint.gone{opacity:0}
.err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-dim);z-index:4}
@media (max-width:520px){h1{font-size:18px}.lab{min-width:0;width:100%}}
</style>

<canvas id="view" aria-label="Ночной лес у ручья. Огонёк следует за курсором или пальцем; нажатие играет ноту."></canvas>
<div class="film"></div><div class="grain"></div>
<div class="wake" id="wake" role="status"><span id="wakeT">Лес просыпается</span></div>
<div class="hint" id="hint">Водите мышью или пальцем — это ваш огонёк. Нажмите, чтобы сыграть ноту; подержите — расцветёт цветок.</div>
<div class="panel" id="panel" role="group" aria-label="Настройки леса">
  <div class="eyebrow">Handsong · Calm · эскиз</div>
  <h1>Живой лес</h1>
  <div class="more">
    <div class="row"><span class="lab">Настроение</span>
      <button data-mood="glow" aria-pressed="true">Сияние</button><button data-mood="dusk" aria-pressed="false">Сумерки</button><button data-mood="mist" aria-pressed="false">Туман</button></div>
  </div>
  <div class="more">
    <div class="row"><span class="lab">Качество</span>
      <button data-q="low" aria-pressed="false">Низкое</button><button data-q="mid" aria-pressed="true">Среднее</button><button data-q="high" aria-pressed="false">Высокое</button></div>
  </div>
  <div class="more"><div class="row"><span class="lab">Живопись</span><button id="paint" aria-pressed="true">Мазки вдали: вкл</button></div></div>
  <div class="row"><button id="snd" class="sound" aria-pressed="false">Включить звук</button><button class="fold" id="fold">Свернуть</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async()=>{
const MARKS=[],T0=performance.now(),mark=n=>MARKS.push(n+' '+Math.round(performance.now()-T0));
const cv=document.getElementById('view'),hint=document.getElementById('hint'),wake=document.getElementById('wake'),wakeT=document.getElementById('wakeT');
const say=t=>{wakeT.textContent=t};
const breathe=()=>new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
const fail=m=>{wake.classList.add('gone');const d=document.createElement('div');d.className='err';d.textContent=m;document.body.appendChild(d)};
if(!window.THREE){fail('Не удалось загрузить 3D-движок. Обновите страницу.');return}
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'})}catch(e){fail('Этот браузер не поддерживает WebGL.');return}
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const V=(x,y,z)=>new THREE.Vector3(x,y,z),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const ANI=Math.min(8,renderer.capabilities.getMaxAnisotropy());
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const small=Math.min(innerWidth,innerHeight)<600;
/* quality: pixel ratio, moon shadow map, share of undergrowth, max stroke radius, bloom */
const QUAL={low:{pr:.55,shadow:0,cover:.35,leaf:.55,kr:2,bloom:0},mid:{pr:.8,shadow:1024,cover:.75,leaf:.85,kr:3,bloom:1},high:{pr:1,shadow:2048,cover:1,leaf:1,kr:4,bloom:1}};
let qual=small?'low':'mid';
say('Лес просыпается · земля');await breathe();

/* ---------------- tiny utilities ---------------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function canvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return[c,c.getContext('2d')]}
function tex(c,srgb,rx=1,ry=1){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=ANI;if(srgb)t.encoding=THREE.sRGBEncoding;return t}
function clampTex(t){t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;return t}
function smooth(a,b,x){const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)}
function shuffle(a,rr){for(let i=a.length-1;i>0;i--){const j=(rr()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function hsl2rgb(h,s2,l){h/=360;const k=n=>(n+h*12)%12,a=s2*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return[f(0),f(8),f(4)]}
/* height canvas → tangent-space normal map (Sobel) */
function normalFrom(hc,strength){const w=hc.width,h=hc.height,src=hc.getContext('2d').getImageData(0,0,w,h).data,[nc,nx]=canvas(w,h),out=nx.createImageData(w,h),o=out.data;
  const H=(x,y)=>src[(((y+h)%h)*w+((x+w)%w))*4]/255;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const dx=(H(x+1,y-1)+2*H(x+1,y)+H(x+1,y+1))-(H(x-1,y-1)+2*H(x-1,y)+H(x-1,y+1)),dy=(H(x-1,y+1)+2*H(x,y+1)+H(x+1,y+1))-(H(x-1,y-1)+2*H(x,y-1)+H(x+1,y-1));
    let nX=-dx*strength,nY=dy*strength,nZ=1;const l=Math.hypot(nX,nY,nZ);const i=(y*w+x)*4;o[i]=(nX/l*.5+.5)*255;o[i+1]=(nY/l*.5+.5)*255;o[i+2]=(nZ/l*.5+.5)*255;o[i+3]=255}
  nx.putImageData(out,0,0);return nc}
/* value noise for the terrain (JS side) */
const vn=(()=>{const P=new Uint8Array(512),R=rng(7);for(let i=0;i<256;i++)P[i]=i;for(let i=255;i>0;i--){const j=(R()*(i+1))|0;[P[i],P[j]]=[P[j],P[i]]}for(let i=0;i<256;i++)P[i+256]=P[i];
  const g=(x,y)=>P[(P[x&255]+y)&255]/255,f=t=>t*t*(3-2*t);
  return(x,y)=>{const X=Math.floor(x),Y=Math.floor(y),u=f(x-X),v=f(y-Y);return lerp(lerp(g(X,Y),g(X+1,Y),u),lerp(g(X,Y+1),g(X+1,Y+1),u),v)}})();
const fbm=(x,y)=>vn(x,y)*.5+vn(x*2.1+5,y*2.1+3)*.27+vn(x*4.3+9,y*4.3+1)*.15+vn(x*8.7,y*8.7)*.08;

/* GLSL noise shared by the shaders: value noise, fractal sums, and a domain-warped fractal (noise bent by noise) */
const NOISE=`float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
float fbm2(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vnoise(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return s;}
float wfbm(vec2 p){vec2 q=vec2(fbm2(p),fbm2(p+vec2(5.2,1.3)));return fbm2(p+1.8*q);}`;

/* ---------------- textures, all drawn in code ---------------- */
const R=rng(20261020);
const HALO=(()=>{const[c,x]=canvas(128,128);const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.15,'rgba(255,255,255,.5)');g.addColorStop(.45,'rgba(255,255,255,.1)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,128,128);return clampTex(tex(c,true))})();
const wrap9=(W,H,fn,x=W/2,y=H/2,r=1e9)=>{for(const dx of[-W,0,W]){if(dx<0&&x<=W-r||dx>0&&x>=r)continue;for(const dy of[-H,0,H]){if(dy<0&&y<=H-r||dy>0&&y>=r)continue;fn(dx,dy)}}};

/* forest floor: soil, fallen leaves, needles, twigs, moss crumbs — colour + height */
const LITTER=(()=>{const S=1024,[cc,c]=canvas(S,S),[hc,h]=canvas(S,S);
  c.fillStyle='#1b140d';c.fillRect(0,0,S,S);h.fillStyle='#2a2a2a';h.fillRect(0,0,S,S);
  for(let i=0;i<260;i++){const x=R()*S,y=R()*S,r=20+R()*90,dark=R()<.5;
    wrap9(S,S,(dx,dy)=>{const g=c.createRadialGradient(x+dx,y+dy,0,x+dx,y+dy,r);g.addColorStop(0,dark?'rgba(8,6,4,.45)':'rgba(60,44,26,.3)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(x+dx-r,y+dy-r,2*r,2*r)},x,y,r)}
  const leaf=(ctx,x,y,len,wid,a,fill,rib)=>{ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.beginPath();ctx.moveTo(-len/2,0);
    ctx.bezierCurveTo(-len*.2,-wid,len*.25,-wid*.9,len/2,0);ctx.bezierCurveTo(len*.25,wid*.9,-len*.2,wid,-len/2,0);ctx.fillStyle=fill;ctx.fill();
    if(rib){ctx.strokeStyle=rib;ctx.lineWidth=Math.max(.6,wid*.12);ctx.beginPath();ctx.moveTo(-len/2,0);ctx.lineTo(len/2,0);ctx.stroke()}ctx.restore()};
  for(let i=0;i<5200;i++){const x=R()*S,y=R()*S,len=10+R()*26,wid=len*(.22+R()*.2),a=R()*6.28,hu=14+R()*30,sa=28+R()*40,li=8+R()*22,lay=i/5200;
    const col=`hsl(${hu},${sa}%,${li}%)`,rib=`hsla(${hu},${sa}%,${li*.55}%,.8)`;
    wrap9(S,S,(dx,dy)=>{leaf(c,x+dx,y+dy,len,wid,a,col,rib);leaf(h,x+dx,y+dy,len,wid,a,`rgb(${90+lay*150|0},${90+lay*150|0},${90+lay*150|0})`,null)},x,y,len)}
  for(let i=0;i<2600;i++){const x=R()*S,y=R()*S,l=6+R()*12,a=R()*6.28,li=10+R()*16;
    wrap9(S,S,(dx,dy)=>{for(const[ctx,st]of[[c,`hsl(${28+R()*12},40%,${li}%)`],[h,'rgba(235,235,235,.8)']]){ctx.strokeStyle=st;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(x+dx,y+dy);ctx.lineTo(x+dx+Math.cos(a)*l,y+dy+Math.sin(a)*l);ctx.stroke()}},x,y,l)}
  for(let i=0;i<120;i++){const x=R()*S,y=R()*S,l=30+R()*80,a=R()*6.28,wd=2+R()*3;
    wrap9(S,S,(dx,dy)=>{for(const[ctx,st]of[[c,'#2a1d12'],[h,'#ffffff']]){ctx.strokeStyle=st;ctx.lineWidth=wd;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x+dx,y+dy);
      ctx.quadraticCurveTo(x+dx+Math.cos(a+.3)*l*.5,y+dy+Math.sin(a+.3)*l*.5,x+dx+Math.cos(a)*l,y+dy+Math.sin(a)*l);ctx.stroke()}},x,y,l+4)}
  for(let i=0;i<1800;i++){const x=R()*S,y=R()*S,r=1+R()*2.6;wrap9(S,S,(dx,dy)=>{c.fillStyle=`hsl(${80+R()*30},${35+R()*25}%,${12+R()*12}%)`;c.beginPath();c.arc(x+dx,y+dy,r,0,6.28);c.fill();
    h.fillStyle='rgba(200,200,200,.6)';h.beginPath();h.arc(x+dx,y+dy,r,0,6.28);h.fill()},x,y,r)}
  return{map:tex(cc,true),normal:tex(normalFrom(hc,2.2),false)}})();

/* bark: vertical fissures and plates, lichen */
const BARK=(()=>{const W=512,H=1024,[cc,c]=canvas(W,H),[hc,h]=canvas(W,H);
  c.fillStyle='#2b241d';c.fillRect(0,0,W,H);h.fillStyle='#b0b0b0';h.fillRect(0,0,W,H);
  for(let i=0;i<200;i++){const x=R()*W,y=R()*H,w=8+R()*30,l=40+R()*160,li=14+R()*14;
    wrap9(W,H,(dx,dy)=>{c.fillStyle=`hsla(${22+R()*14},${12+R()*12}%,${li}%,.55)`;c.fillRect(x+dx,y+dy,w,l);h.fillStyle=`rgba(255,255,255,${.25+R()*.3})`;h.fillRect(x+dx,y+dy,w,l)},x,y,Math.max(w,l))}
  for(let i=0;i<120;i++){const x0=R()*W,ph=R()*6.28,wd=1.5+R()*5,amp=3+R()*8;
    for(const dx of[-W,0,W]){for(const[ctx,st]of[[c,'rgba(6,5,4,.85)'],[h,'rgba(0,0,0,.95)']]){ctx.strokeStyle=st;ctx.lineWidth=wd;ctx.beginPath();
      for(let y=0;y<=H;y+=8){const x=x0+dx+Math.sin(y*.012+ph)*amp+Math.sin(y*.05+ph*2)*2;y?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}}}
  for(let i=0;i<40;i++){const x=R()*W,y=R()*H,r=6+R()*20;wrap9(W,H,(dx,dy)=>{const g=c.createRadialGradient(x+dx,y+dy,0,x+dx,y+dy,r);g.addColorStop(0,'rgba(120,138,112,.35)');g.addColorStop(1,'rgba(120,138,112,0)');c.fillStyle=g;c.fillRect(x+dx-r,y+dy-r,2*r,2*r)},x,y,r)}
  return{map:tex(cc,true,2,4),normal:tex(normalFrom(hc,3.5),false,2,4)}})();
mark('ground textures');say('Лес просыпается · травы');await breathe();

/* ferns from iterated function systems: a few affine maps repeated many times give a frond with leaflets inside leaflets */
function ifsFern(maps,iters,W,H,seed,hue,light){const rr=rng(seed),cum=[];let acc=0;for(const m of maps){acc+=m[6];cum.push(acc)}
  const pts=new Float32Array(iters*2);let n=0,x=0,y=0,x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(let i=0;i<iters;i++){const r=rr()*acc;let k=0;while(r>cum[k])k++;const m=maps[k],nx=m[0]*x+m[1]*y+m[4],ny=m[2]*x+m[3]*y+m[5];x=nx;y=ny;if(i<20)continue;
    pts[n++]=x;pts[n++]=y;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  const s=Math.min((W-8)/(x1-x0),(H-8)/(y1-y0)),ox=(W-(x1-x0)*s)/2,dens=new Float32Array(W*H);
  for(let i=0;i<n;i+=2){const px=Math.floor(ox+(pts[i]-x0)*s),py=Math.floor(H-4-(pts[i+1]-y0)*s);if(px>=0&&px<W&&py>=0&&py<H)dens[py*W+px]+=1}
  const bl=new Float32Array(W*H);let sum=0,cnt=0;for(let yy=1;yy<H-1;yy++)for(let xx=1;xx<W-1;xx++){let a=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)a+=dens[(yy+dy)*W+xx+dx];a/=9;bl[yy*W+xx]=a;if(a>0){sum+=a;cnt++}}
  const avg=sum/Math.max(1,cnt),[cc,c]=canvas(W,H),img=c.createImageData(W,H),d=img.data,cn=rng(seed+1);
  for(let p=0;p<W*H;p++){const v=bl[p];if(v<avg*.04)continue;const t=1-Math.floor(p/W)/H;
    const[r,g,b]=hsl2rgb(hue-t*14+(cn()-.5)*10,.42+t*.12,light+t*.16+Math.min(.08,v/avg*.02)+(cn()-.5)*.04);
    d[p*4]=r*255;d[p*4+1]=g*255;d[p*4+2]=b*255;d[p*4+3]=Math.min(255,v/avg*190)}
  c.putImageData(img,0,0);return clampTex(tex(cc,true))}
const FERN=ifsFern([[0,0,0,.16,0,0,.01],[.85,.04,-.04,.85,0,1.6,.85],[.2,-.26,.23,.22,0,1.6,.07],[-.15,.28,.26,.24,0,.44,.07]],900000,384,1024,5,104,.10);
/* a second, finer species (the "mutant" Barnsley fern): longer, more delicate pinnae */
const FERN2=ifsFern([[0,0,0,.25,0,-.4,.02],[.95,.005,-.005,.93,-.002,.5,.84],[.035,-.2,.16,.04,-.09,.02,.07],[-.04,.2,.16,.04,.083,.12,.07]],900000,384,1024,9,98,.075);

/* blades for grass and sedges */
function bladeTex(W,H,n,hmin,hmax,wmax,hue){const[cc,c]=canvas(W,H);
  for(let i=0;i<n;i++){const x0=W/2+(R()-.5)*W*.5,h=H*(hmin+R()*(hmax-hmin)),bend=(R()-.5)*(W*.3+h*.45),w=.7+R()*wmax,dry=R()<.12;

      .replace('#include <begin_vertex>',`#include <begin_vertex>
        vec4 wq=vec4(transformed,1.);vec3 nq=objectNormal;vec4 bq=vec4(0.,0.,0.,1.);

const dbs=new THREE.Vector2();

/* ---------------- input: a pointer is a hand ---------------- */

  else if(AC.state==='running'){AC.suspend();snd.textContent='Звук: выкл';snd.setAttribute('aria-pressed','false')}else{AC.resume();snd.textContent='Звук: вкл';snd.setAttribute('aria-pressed','true')}});

const panel=document.getElementById('panel'),fold=document.getElementById('fold');if(small){panel.classList.add('min');fold.textContent='Настройки'}fold.addEventListener('click',()=>{panel.classList.toggle('min');fold.textContent=panel.classList.contains('min')?'Настройки':'Свернуть'});

/* ---------------- frame loop ---------------- */
let prev=performance.now(),paused=false;const tmp=V(0,0,0),tan=V(0,0,0);

})();
