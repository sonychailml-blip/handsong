<title>Стекло под дождём</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#0b0a10;--ink:#f1e6d6;--muted:#b9a993;--panel:rgba(18,15,20,.74);--line:rgba(244,201,138,.22);--accent:#F4C98A;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:none}
.hint{position:fixed;left:50%;top:calc(18% + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:calc(100vw - 32px);text-align:center;font-size:17px;letter-spacing:.01em;color:var(--ink);text-shadow:0 1px 12px rgba(0,0,0,.6);pointer-events:none;transition:opacity 1.2s}
.panel{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 32px));padding:14px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:10px}
.panel h1{margin:0;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.row{display:grid;grid-template-columns:52px auto 1fr auto;align-items:center;gap:8px}
.row label{font-weight:600}
.row .e{font-size:12px;color:var(--muted)}
input[type=range]{width:100%;min-width:0;accent-color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer}
button:hover{border-color:var(--accent)}
.note{margin:0;font-size:12px;color:var(--muted)}
.panel.min .body{display:none}
</style>

<canvas id="c" aria-label="Окно в дождь: запотевшее стекло, капли и ночной город"></canvas>
<div class="hint" id="hint">Проведите пальцем или мышью по запотевшему стеклу</div>
<div class="panel" id="panel">
  <h1>Эталон стекла · «Дождь»</h1>
  <div class="body" style="display:flex;flex-direction:column;gap:10px">
    <div class="row"><label for="focus">Фокус</label><span class="e">стекло</span><input id="focus" type="range" min="0" max="1000" value="40"><span class="e">холмы</span></div>
    <div class="row"><label for="rain">Дождь</label><span class="e">морось</span><input id="rain" type="range" min="0" max="1000" value="550"><span class="e">ливень</span></div>
    <div class="btns"><button id="refog">Запотеть снова</button><button id="clear">Протереть всё</button></div>
    <p class="note">Колесо мыши тоже двигает фокус. Город здесь условный, только чтобы показать стекло и фокус по глубине: улица, дом, холмы резкие каждый на своём расстоянии.</p>
  </div>
  <div class="btns"><button id="min">Свернуть</button></div>
</div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c};
const FILTER_OK=(()=>{try{const x=mk(2,2).getContext('2d');x.filter='blur(1px)';return x.filter==='blur(1px)'}catch(e){return false}})();
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// a copy of src at 1/f size, blurred by px (px in full-size pixels)
function blurTo(src,px,f){
  const w=src.width/f,h=src.height/f,c=mk(w,h),x=c.getContext('2d');x.imageSmoothingQuality='high';
  if(px>0&&FILTER_OK){x.filter=`blur(${(px/f).toFixed(2)}px)`;x.drawImage(src,0,0,c.width,c.height);return c}
  if(px>0){const g=Math.max(2,px/2),t=mk(src.width/(f*g),src.height/(f*g)),tx=t.getContext('2d');tx.imageSmoothingQuality='high';tx.drawImage(src,0,0,t.width,t.height);x.drawImage(t,0,0,c.width,c.height);return c}
  x.drawImage(src,0,0,c.width,c.height);return c;
}

let W,H,S,bg,bgx,glass,gx,micro,mx,fog,fx,mask,kx,noise,sky,vign,sprite,LAYERS=[],LIGHTS=[],WINS=[],cars=[],tram=null,drops=[],VP;
const FS=5;                     // the mist works at 1/5 of the size
const BL=[0,4,10,22],BF=[1,2,3,5]; // blur levels (css px) and their storage scale
const st={focus:.04,focusT:.04,rain:.55,t:0,refill:0,spawn:0,micro:0,winT:0,tramT:6,wiped:false};
const ptr={x:0,y:0,lx:0,ly:0,down:false,seen:false};
// depth of things, 0 = the glass ... 1 = the hills; the focus is a point on the same line
const D={hills:.97,far:.85,house:.72};
const streetD=t=>lerp(.68,.38,t); // the street comes nearer towards the bottom of the frame

function build(){
  let dpr=Math.min(window.devicePixelRatio||1,1.5);const cw=innerWidth,ch=innerHeight;
  if(cw*ch*dpr*dpr>2.4e6)dpr=Math.sqrt(2.4e6/(cw*ch));
  W=Math.round(cw*dpr);H=Math.round(ch*dpr);cv.width=W;cv.height=H;S=dpr;
  bg=mk(W,H);bgx=bg.getContext('2d');glass=mk(W,H);gx=glass.getContext('2d');
  fog=mk(W/FS,H/FS);fx=fog.getContext('2d');
  const oldMask=mask;mask=mk(W/FS,H/FS);kx=mask.getContext('2d');
  if(oldMask)kx.drawImage(oldMask,0,0,mask.width,mask.height);else{kx.fillStyle='#fff';kx.fillRect(0,0,mask.width,mask.height)}
  VP={x:.42*W,y:.665*H};
  const R=rng(7);LIGHTS=[];WINS=[];cars=[];tram=null;
  buildSky(R);LAYERS=[];LAYERS.push(mkLayer(D.hills,x=>drawHills(x,R)));LAYERS.push(mkLayer(D.far,x=>drawFar(x,R)));LAYERS.push(mkLayer(D.house,x=>drawHouse(x,R)));LAYERS.push(mkLayer(.52,x=>drawStreet(x,R)));
  buildNoise(R);buildVignette();buildSprite();
  micro=mk(W,H);mx=micro.getContext('2d');
  const n=Math.round(5200*(cw*ch)/(1440*900));for(let i=0;i<n;i++)microDot(Math.random()*W,Math.random()*H,S*(.35+Math.pow(Math.random(),2)*1.5));
  drops=[];for(let i=0;i<380;i++)spawnDrop();
}
function mkLayer(d,fn){const base=mk(W,H);fn(base.getContext('2d'));return{d,idx:LAYERS.length,lv:BL.map((b,i)=>blurTo(base,b*S,BF[i]))}}

function buildSky(R){
  sky=mk(W,H);const x=sky.getContext('2d');
  let g=x.createLinearGradient(0,0,0,H*.62);g.addColorStop(0,'#131220');g.addColorStop(.35,'#1B1A2B');g.addColorStop(.72,'#4b3243');g.addColorStop(1,'#83563f');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  const cl=mk(W/6,H/6),c=cl.getContext('2d');
  for(let i=0;i<22;i++){const cx=R()*cl.width,cy=R()*cl.height*.45,rx=(.08+R()*.25)*cl.width,ry=rx*(.18+R()*.15);
    c.fillStyle=`rgba(${Math.round(lerp(90,150,R()))},${Math.round(lerp(58,92,R()))},${Math.round(lerp(70,74,R()))},${(.18+R()*.25).toFixed(2)})`;c.beginPath();c.ellipse(cx,cy,rx,ry,0,0,TAU);c.fill()}
  x.drawImage(blurTo(cl,10,1),0,0,W,H);
  g=x.createRadialGradient(.55*W,.5*H,0,.55*W,.5*H,.6*W);g.addColorStop(0,'rgba(160,100,70,.35)');g.addColorStop(1,'rgba(160,100,70,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
}
function hillY(f){return H*(.455+.03*Math.sin(f*5.1+1.3)+.017*Math.sin(f*13.7+.4)-.045*Math.exp(-((f-.16)**2)/.006)-.025*Math.exp(-((f-.72)**2)/.01))}
function drawHills(x,R){
  x.beginPath();x.moveTo(0,H);for(let i=0;i<=200;i++){const f=i/200;x.lineTo(f*W,hillY(f))}x.lineTo(W,H);x.closePath();
  let g=x.createLinearGradient(0,.38*H,0,.7*H);g.addColorStop(0,'#2c2129');g.addColorStop(1,'#19141a');x.fillStyle=g;x.fill();
  // fortress wall on the crest
  x.strokeStyle='#5b4636';x.lineWidth=2*S;x.beginPath();for(let f=.64;f<=.79;f+=.005){const y=hillY(f)+6*S;f===.64?x.moveTo(f*W,y):x.lineTo(f*W,y)}x.stroke();
  for(let f=.645;f<.79;f+=.018)LIGHTS.push({L:0,d:D.hills,x:f*W,y:hillY(f)+8*S,sz:1.5*S,col:'255,194,122',a:.75});
  // domes
  for(const f of[.5,.535]){const y=hillY(f)+10*S;x.fillStyle='#1a1418';x.beginPath();x.arc(f*W,y,6*S,Math.PI,0);x.fill();x.fillRect(f*W-6*S,y,12*S,14*S);x.fillRect(f*W-.6*S,y-12*S,1.2*S,7*S);LIGHTS.push({L:0,d:D.hills,x:f*W,y:y+6*S,sz:1.4*S,col:'255,200,140',a:.7})}
  // the tv tower
  const tx=.16*W,ty=hillY(.16),top=.17*H;x.strokeStyle='#141015';x.lineWidth=1.4*S;
  x.beginPath();x.moveTo(tx-9*S,ty);x.lineTo(tx-1.5*S,top);x.moveTo(tx+9*S,ty);x.lineTo(tx+1.5*S,top);
  for(let k=1;k<6;k++){const y=lerp(ty,top,k/6),w=lerp(9,1.5,k/6)*S;x.moveTo(tx-w,y);x.lineTo(tx+w,y)}x.stroke();
  for(const k of[0,.45,.8])LIGHTS.push({L:0,d:D.hills,x:tx,y:lerp(top,ty,k*.6),sz:1.6*S,col:'255,60,50',a:.95,blink:k*2});
  // lights climbing the slopes
  for(let i=0;i<300;i++){const f=R(),y0=hillY(f)+3*S,y=y0+Math.pow(R(),1.6)*.16*H;
    LIGHTS.push({L:0,d:D.hills,x:f*W,y,sz:(.6+R()*.8)*S,col:R()<.6?'255,185,94':R()<.7?'242,154,58':'255,214,160',a:.45+R()*.45})}
}
function drawFar(x,R){
  const x0=-.02*W,x1=.37*W,t0=.475*H,t1=.44*H,b=.69*H;
  x.beginPath();x.moveTo(x0,t0);x.lineTo(x1,t1);x.lineTo(x1,b);x.lineTo(x0,b);x.closePath();
  let g=x.createLinearGradient(0,t1,0,b);g.addColorStop(0,'#221a19');g.addColorStop(1,'#3c2e25');x.fillStyle=g;x.fill();
  x.fillStyle='#17110f';for(let i=0;i<5;i++){const cx=lerp(x0,x1,.1+i*.2),cy=lerp(t0,t1,.1+i*.2);x.fillRect(cx,cy-12*S,6*S,12*S)}
  for(let r=0;r<4;r++)for(let c=0;c<10;c++){const u=(c+.3)/10,ww=(x1-x0)*.045;const xx=lerp(x0,x1,u),top=lerp(t0,t1,u)+(b-lerp(t0,t1,u))*(.1+r*.21),hh=(b-t1)*.1;
    x.fillStyle='#0e0b0c';x.fillRect(xx,top,ww,hh);addWin(xx,top,ww,hh,D.far,1,R,.4)}
}
function hq(u,v){ // the house opposite: bilinear corners
  const TL=[.5*W,.17*H],TR=[1.06*W,.06*H],BL_=[.5*W,.72*H],BR=[1.06*W,.70*H];
  const tx=lerp(TL[0],TR[0],u),ty=lerp(TL[1],TR[1],u),bx=lerp(BL_[0],BR[0],u),by=lerp(BL_[1],BR[1],u);return[lerp(tx,bx,v),lerp(ty,by,v)]}
function drawHouse(x,R){
  const P=(u,v)=>hq(u,v);
  // roof
  x.fillStyle='#1a1415';x.beginPath();let p=P(0,0);x.moveTo(p[0],p[1]);p=P(1,0);x.lineTo(p[0],p[1]);x.lineTo(p[0],p[1]-.05*H);p=P(0,0);x.lineTo(p[0]+.02*W,p[1]-.045*H);x.closePath();x.fill();
  for(let i=0;i<4;i++){const q=P(.12+i*.24,0);x.fillStyle='#130f10';x.fillRect(q[0],q[1]-.07*H,9*S,.05*H)}
  const at=P(.6,0);LIGHTS.push({L:2,d:D.house,x:at[0],y:at[1]-.022*H,sz:3*S,w:7*S,h:9*S,col:'255,185,94',a:.9});
  // the facade
  x.beginPath();p=P(0,0);x.moveTo(...p);x.lineTo(...P(1,0));x.lineTo(...P(1,1));x.lineTo(...P(0,1));x.closePath();
  let g=x.createLinearGradient(0,.1*H,0,.72*H);g.addColorStop(0,'#241c1b');g.addColorStop(.6,'#2A2220');g.addColorStop(1,'#5b4634');x.fillStyle=g;x.fill();
  x.strokeStyle='rgba(107,84,64,.55)';x.lineWidth=2*S;for(let k=0;k<=6;k++){const v=k/6.4;x.beginPath();x.moveTo(...P(0,v));x.lineTo(...P(1,v));x.stroke()}
  const rows=6,cols=8;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const u0=(c+.28)/cols,u1=(c+.72)/cols,v0=(r+.22)/6.4,v1=(r+.82)/6.4;const a=P(u0,v0),b=P(u1,v0),d=P(u0,v1),e=P(u1,v1);
    x.fillStyle='#0c0a0b';x.beginPath();x.moveTo(d[0],d[1]);x.lineTo(a[0],a[1]+ (b[0]-a[0])*.35);x.quadraticCurveTo((a[0]+b[0])/2,(a[1]+b[1])/2-(b[0]-a[0])*.25,b[0],b[1]+(b[0]-a[0])*.35);x.lineTo(e[0],e[1]);x.closePath();x.fill();
    x.strokeStyle='#3d3027';x.lineWidth=1*S;x.stroke();
    if(r%2===1){x.strokeStyle='#120d0c';x.lineWidth=1.3*S;const y0=e[1]+2*S;x.beginPath();x.moveTo(d[0]-3*S,d[1]+2*S);x.lineTo(e[0]+3*S,y0);for(let k=0;k<=6;k++){const q=lerp(d[0]-3*S,e[0]+3*S,k/6),qy=lerp(d[1]+2*S,y0,k/6);x.moveTo(q,qy);x.lineTo(q,qy-7*S)}x.stroke()}
    const minx=Math.min(a[0],d[0]),maxx=Math.max(b[0],e[0]),miny=Math.min(a[1],b[1]),maxy=Math.max(d[1],e[1]);
    addWin(minx+1*S,miny+(maxx-minx)*.2,maxx-minx-2*S,maxy-miny-(maxx-minx)*.2,D.house,2,R,.36);
  }
  // shop windows on the ground floor
  for(let c=0;c<5;c++){const a=P(.05+c*.19,.9),e=P(.17+c*.19,.985);LIGHTS.push({L:2,d:D.house-.04,x:(a[0]+e[0])/2,y:(a[1]+e[1])/2,w:e[0]-a[0],h:e[1]-a[1],sz:Math.sqrt((e[0]-a[0])*(e[1]-a[1]))/2,col:c===2?'232,106,146':'255,200,140',a:c===2?.7:.55})}
  const cr=P(.8,.86);LIGHTS.push({L:2,d:D.house-.04,x:cr[0],y:cr[1],sz:4*S,col:'79,209,160',a:.95,cross:1});
}
function addWin(x,y,w,h,d,L,R,p){const on=R()<p,tv=R()<.07;WINS.push({L,d,x:x+w/2,y:y+h/2,w,h,sz:Math.sqrt(w*h)/2,col:tv?'127,166,224':R()<.6?'255,185,94':'242,154,58',a:.8,lvl:on?1:0,tgt:on?1:0,tv})}
function roadX(t,f){return lerp(VP.x+(f-.5)*.04*W,lerp(-.25*W,1.12*W,f),t)}
function roadY(t){return lerp(VP.y,H*1.03,t)}
function drawStreet(x,R){
  // ground under everything near
  x.fillStyle='#16161d';x.beginPath();x.moveTo(0,.675*H);x.lineTo(.37*W,.69*H);x.lineTo(VP.x,VP.y);x.lineTo(W,.705*H);x.lineTo(W,H);x.lineTo(0,H);x.closePath();x.fill();
  // the road
  x.fillStyle='#101420';x.beginPath();x.moveTo(roadX(0,0),roadY(0));x.lineTo(roadX(0,1),roadY(0));x.lineTo(roadX(1,1),roadY(1));x.lineTo(roadX(1,0),roadY(1));x.closePath();x.fill();
  // wet sheen
  const g=x.createLinearGradient(0,VP.y,0,H);g.addColorStop(0,'rgba(120,90,70,.18)');g.addColorStop(1,'rgba(40,40,60,.05)');x.fillStyle=g;x.fill();
  // tram tracks and wires
  x.strokeStyle='#2a2934';for(const f of[.44,.47,.53,.56]){x.lineWidth=1.2*S;x.beginPath();x.moveTo(roadX(0,f),roadY(0));x.lineTo(roadX(1,f),roadY(1));x.stroke()}
  x.strokeStyle='rgba(30,26,34,.9)';x.lineWidth=1*S;for(const f of[.46,.54]){x.beginPath();for(let i=0;i<=20;i++){const t=i/20,y=roadY(t)-(8+150*t)*S;i?x.lineTo(roadX(t,f),y):x.moveTo(roadX(t,f),y)}x.stroke()}
  // plane trees and lamps along both sides
  const ts=[.1,.2,.32,.46,.62,.8,1.0];
  for(const side of[-.04,1.04])for(const t of ts){
    const bx=roadX(t,side),by=roadY(t),h=(14+150*t)*S;
    if(t>.08&&t<.98&&((t*10|0)%2===0)){ // a lamp
      x.strokeStyle='#0d0c10';x.lineWidth=(.8+2.2*t)*S;x.beginPath();x.moveTo(bx,by);x.lineTo(bx,by-h);x.stroke();
      LIGHTS.push({L:3,d:streetD(t),x:bx,y:by-h,sz:(1.2+5*t)*S,col:'255,194,122',a:1,refl:1,gy:by,halo:1});
    }
    const cr=(6+90*Math.pow(t,1.25))*S,cx=roadX(t,side<0?-.12:1.12),cy=by-h*.95;
    x.fillStyle='#120f0c';for(let k=0;k<7;k++){x.beginPath();x.ellipse(cx+(R()-.5)*cr*1.2,cy+(R()-.5)*cr*.6,cr*(.45+R()*.35),cr*(.35+R()*.25),0,0,TAU);x.fill()}
    x.fillStyle='rgba(201,150,60,.32)';for(let k=0;k<Math.round(40*t+6);k++){x.beginPath();x.arc(cx+(R()-.5)*cr*1.6,cy+(R()-.5)*cr*.9,(.5+R()*1.2+2*t)*S,0,TAU);x.fill()}
  }
  // a cafe awning, left
  const t=.55,ax=roadX(t,-.2),ay=roadY(t);x.fillStyle='#4a2433';x.beginPath();x.moveTo(ax-60*S,ay-50*S);x.lineTo(ax+40*S,ay-60*S);x.lineTo(ax+50*S,ay-38*S);x.lineTo(ax-55*S,ay-28*S);x.closePath();x.fill();
  LIGHTS.push({L:3,d:streetD(t),x:ax-5*S,y:ay-20*S,w:60*S,h:10*S,sz:30*S,col:'255,190,120',a:.55,refl:1,gy:ay});
  LIGHTS.push({L:3,d:streetD(t),x:ax,y:ay-64*S,w:26*S,h:6*S,sz:13*S,col:'232,106,146',a:.9});
}
function buildNoise(R){noise=mk(W/FS,H/FS);const x=noise.getContext('2d'),im=x.createImageData(noise.width,noise.height);for(let i=0;i<im.data.length;i+=4){const v=200+R()*55;im.data[i]=v;im.data[i+1]=v*.97;im.data[i+2]=v;im.data[i+3]=R()*90}x.putImageData(im,0,0)}
function buildVignette(){vign=mk(W,H);const x=vign.getContext('2d'),g=x.createRadialGradient(W/2,H*.45,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(4,3,6,.6)');x.fillStyle=g;x.fillRect(0,0,W,H)}
function buildSprite(){sprite=mk(128,128);const x=sprite.getContext('2d');
  let g=x.createRadialGradient(64,64,34,64,64,64);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.7,'rgba(0,0,0,.1)');g.addColorStop(1,'rgba(0,0,0,.5)');x.fillStyle=g;x.beginPath();x.arc(64,64,64,0,TAU);x.fill();
  g=x.createRadialGradient(64,96,2,64,96,36);g.addColorStop(0,'rgba(255,226,182,.42)');g.addColorStop(1,'rgba(255,226,182,0)');x.fillStyle=g;x.beginPath();x.arc(64,64,64,0,TAU);x.fill();
  g=x.createRadialGradient(46,40,0,46,40,15);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.beginPath();x.arc(46,40,15,0,TAU);x.fill()}
function microDot(x,y,r){mx.fillStyle='rgba(255,240,225,.10)';mx.beginPath();mx.arc(x,y,r,0,TAU);mx.fill();mx.fillStyle='rgba(0,0,0,.16)';mx.beginPath();mx.arc(x,y+r*.35,r*.75,0,Math.PI);mx.fill();mx.fillStyle='rgba(255,255,255,.4)';mx.beginPath();mx.arc(x-r*.3,y-r*.3,r*.33,0,TAU);mx.fill()}

// ---------- drops: a real simulation, so drops see each other ----------
function merge(d,o){const A=d.r*d.r,B=o.r*o.r;d.x=(d.x*A+o.x*B)/(A+B);if(!d.mv)d.y=(d.y*A+o.y*B)/(A+B);d.r=Math.sqrt(A+B);d.vy=d.vy*A/(A+B);o.dead=true}
function spawnDrop(x=Math.random()*W,y=Math.random()*H,r=S*(1.3+Math.pow(Math.random(),2.3)*(5+6*st.rain))){
  const d={x,y,r,vy:0,vx:0,mv:false,tr:0,dead:false};
  for(const o of drops){if(o.dead)continue;const dx=o.x-x,dy=o.y-y,rr=(o.r+r)*.85;if(dx*dx+dy*dy<rr*rr){merge(o.r>=r?o:d,o.r>=r?d:o);if(d.dead)return;}}
  drops.push(d);return d}
function updDrops(dt){
  const f=dt*60,slideR=7*S,cs=26*S,grid=new Map(),born=[];
  for(const d of drops){const k=((d.x/cs)|0)*8192+((d.y/cs)|0);let a=grid.get(k);if(!a)grid.set(k,a=[]);a.push(d)}
  mx.globalCompositeOperation='destination-out';mx.fillStyle='#000';
  for(const d of drops){
    if(d.dead)continue;
    if(!d.mv){if(d.r>slideR&&Math.random()<.006*f*(d.r/slideR)**4){d.mv=true;d.vy=.2*S}continue}
    d.vy+=.05*S*f*(d.r/slideR);
    if(Math.random()<.035*f)d.vy*=.4;                 // snags on the glass: stop and go
    d.vy=Math.min(d.vy,9*S);
    d.vx=d.vx*.86+(Math.random()-.5)*.5*S;
    const dy=d.vy*f;d.y+=dy;d.x+=d.vx*f*.45;
    d.tr+=dy;                                           // leaves beads behind and loses water
    if(d.tr>d.r*1.25){d.tr=0;if(Math.random()<.8&&d.r>2*S){const r2=d.r*(.15+Math.random()*.22);born.push({x:d.x+(Math.random()-.5)*d.r*.5,y:d.y-d.r*1.2,r:r2,vy:0,vx:0,mv:false,tr:0,dead:false});d.r=Math.sqrt(Math.max(d.r*d.r-r2*r2,.3))}}
    mx.beginPath();mx.ellipse(d.x,d.y-dy*.5,d.r*1.1,d.r+dy*.6+1,0,0,TAU);mx.fill(); // wipes the fine droplets in its lane
    const cx=(d.x/cs)|0,cy=(d.y/cs)|0;                  // eats every drop it touches
    for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const a=grid.get((cx+i)*8192+cy+j);if(!a)continue;
      for(const o of a){if(o===d||o.dead)continue;const ex=o.x-d.x,ey=o.y-d.y,rr=(d.r+o.r)*.8;if(ex*ex+ey*ey<rr*rr){merge(d,o)}}}
    if(d.r<slideR*.55){d.vy*=.9;if(d.vy<.12*S)d.mv=false}
    if(d.y-d.r*3>H)d.dead=true;
  }
  mx.globalCompositeOperation='source-over';
  drops=drops.filter(d=>!d.dead).concat(born);
  if(drops.length>650){drops.sort((a,b)=>(b.mv-a.mv)||(b.r-a.r));drops.length=650}
}

// ---------- drawing ----------
function drawLayer(L,b){let i=0;while(i<BL.length-2&&b>BL[i+1]*S)i++;const b0=BL[i]*S,b1=BL[i+1]*S,a=clamp((b-b0)/(b1-b0),0,1);
  bgx.globalAlpha=1;bgx.drawImage(L.lv[i],0,0,W,H);if(a>.01){bgx.globalAlpha=a;bgx.drawImage(L.lv[i+1],0,0,W,H)}bgx.globalAlpha=1}
const fd=()=>st.focus*.97;                     // the focus as a depth
const blurAt=d=>Math.abs(d-fd())*30*S;         // blur grows with the distance from the focus: every depth has its own sharpness
function light(L,lvl){
  if(lvl<.01)return;const b=blurAt(L.d),sz=L.sz;let a=L.a*lvl;
  if(L.blink!==undefined)a*=.35+.65*(Math.sin(st.t*2.2+L.blink)>.2?1:0);
  if(L.tv)a*=.75+.25*Math.sin(st.t*13+L.x)*Math.sin(st.t*7.3);
  if(L.refl){const len=L.gy-L.y>4*S?(L.gy-L.y)*.9:(14+60*(L.sz/(5*S)))*S,w=sz*1.3+b*.5,g=bgx.createLinearGradient(0,L.gy,0,L.gy+len);
    g.addColorStop(0,`rgba(${L.col},${(.38*a).toFixed(3)})`);g.addColorStop(1,`rgba(${L.col},0)`);bgx.fillStyle=g;bgx.fillRect(L.x-w/2,L.gy,w,len)}
  if(b<1.6){
    bgx.fillStyle=`rgba(${L.col},${a.toFixed(3)})`;
    if(L.cross){bgx.fillRect(L.x-sz,L.y-sz/3,2*sz,2*sz/3);bgx.fillRect(L.x-sz/3,L.y-sz,2*sz/3,2*sz)}
    else if(L.w){bgx.fillRect(L.x-L.w/2,L.y-L.h/2,L.w,L.h)}
    else{bgx.beginPath();bgx.arc(L.x,L.y,sz,0,TAU);bgx.fill()}
    if(L.halo){bgx.fillStyle=`rgba(${L.col},${(a*.12).toFixed(3)})`;bgx.beginPath();bgx.arc(L.x,L.y,sz*4,0,TAU);bgx.fill()}
  }else{ // bokeh: the light grows into a disc and dims by its area
    let r,k;bgx.beginPath();
    if(L.w&&!L.cross){const ww=L.w+b*1.5,hh=L.h+b*1.5;r=Math.max(ww,hh)/2;k=Math.min(.8,Math.pow(L.w*L.h/(ww*hh),.55))*a;bgx.roundRect(L.x-ww/2,L.y-hh/2,ww,hh,Math.min(ww,hh)/2*Math.min(1,b/(.6*Math.min(L.w,L.h)+1)))}
    else{r=sz*.8+b*.85;k=Math.min(.75,Math.pow(1.6*sz*sz/(r*r),.62))*a;bgx.arc(L.x,L.y,r,0,TAU)}
    bgx.fillStyle=`rgba(${L.col},${k.toFixed(3)})`;bgx.fill();
    if(r>7*S){bgx.strokeStyle=`rgba(${L.col},${(k*.5).toFixed(3)})`;bgx.lineWidth=1*S;bgx.stroke()}
  }
}
function drawView(){
  bgx.globalCompositeOperation='source-over';bgx.drawImage(sky,0,0);
  for(const L of LAYERS){drawLayer(L,blurAt(L.d));bgx.globalCompositeOperation='lighter';
    for(const l of LIGHTS)if(l.L===L.idx)light(l,1);
    for(const w of WINS)if(w.L===L.idx)light(w,w.lvl);
    if(L.idx===3){for(const c of cars)drawCar(c);if(tram)drawTram()}
    bgx.globalCompositeOperation='source-over'}
  // rain in the air, at the street's depth
  const ra=.11*st.rain*(1-Math.min(1,Math.abs(fd()-.55)*1.6));
  if(ra>.01){bgx.strokeStyle=`rgba(210,200,220,${ra.toFixed(3)})`;bgx.lineWidth=1*S;bgx.beginPath();for(let i=0;i<160*st.rain;i++){const x=Math.random()*W,y=Math.random()*H*.95,l=(10+Math.random()*16)*S;bgx.moveTo(x,y);bgx.lineTo(x-l*.12,y+l)}bgx.stroke()}
}
function drawCar(c){const t=c.t,x=roadX(t,c.f),y=roadY(t),sep=(2.5+30*t)*S,sz=(.7+3.6*t)*S,d=streetD(t);
  for(const s of[-1,1])light({d,x:x+s*sep/2,y,sz,col:c.away?'255,60,45':'255,240,214',a:c.away?.85:1,refl:1,gy:y,halo:!c.away},1)}
function drawTram(){const t=tram.t,d=streetD(t);for(let k=0;k<6;k++){const tt=clamp(t-k*.012*(tram.away?-1:1)*(.4+t),0,1),x=roadX(tt,.5),y=roadY(tt)-(3+40*tt)*S;
  light({d,x,y,w:(3+18*tt)*S,h:(2+10*tt)*S,sz:(2+9*tt)*S,col:'255,213,154',a:.85,refl:1,gy:roadY(tt)},1)}
  if(tram.spark>0){const x=roadX(t,.5),y=roadY(t)-(8+150*t)*S;light({d,x,y,sz:(1.5+4*t)*S,col:'221,235,255',a:tram.spark,halo:1},1)}}

function drawGlass(){
  gx.clearRect(0,0,W,H);gx.drawImage(micro,0,0);
  for(const d of drops){const rx=d.r,ry=d.r*(1+Math.min(d.vy/(12*S),.35));
    if(d.r>1.7*S){gx.save();gx.beginPath();gx.ellipse(d.x,d.y,rx,ry,0,0,TAU);gx.clip();
      const k=5,sw=rx*2*k,sh=ry*2*k,sx=clamp(d.x-sw/2,0,W-sw),sy=clamp(d.y-sh/2,0,H-sh);
      gx.translate(d.x,d.y);gx.scale(1,-1);gx.drawImage(bg,sx,sy,sw,sh,-rx,-ry,2*rx,2*ry);gx.restore()}  // a lens: the view upside down and wide
    gx.drawImage(sprite,d.x-rx,d.y-ry,2*rx,2*ry)}
}
function frame(now){
  const dt=Math.min(.05,(now-(frame.l||now))/1000);frame.l=now;st.t+=dt;
  st.focus+=(st.focusT-st.focus)*Math.min(1,dt*5);
  // weather and life
  st.spawn+=dt*(4+st.rain*50);while(st.spawn>=1){st.spawn--;spawnDrop()}
  st.micro+=dt*(30+st.rain*120);while(st.micro>=1){st.micro--;microDot(Math.random()*W,Math.random()*H,S*(.35+Math.pow(Math.random(),2)*1.5))}
  updDrops(dt);
  st.winT-=dt;if(st.winT<0){st.winT=.6;const w=WINS[(Math.random()*WINS.length)|0];if(w)w.tgt=Math.random()<.36?1:0}
  for(const w of WINS)w.lvl+=(w.tgt-w.lvl)*Math.min(1,dt*1.5);
  if(Math.random()<dt*.9&&cars.length<7){const away=Math.random()<.5;cars.push({away,f:away?.6+Math.random()*.08:.32+Math.random()*.08,t:away?1.02:0})}
  for(const c of cars)c.t+=(c.away?-1:1)*dt*(.025+.11*c.t);cars=cars.filter(c=>c.t>=0&&c.t<=1.05);
  st.tramT-=dt;if(!tram&&st.tramT<0){tram={away:Math.random()<.5,t:0,spark:0};tram.t=tram.away?1.05:0;st.tramT=18+Math.random()*12}
  if(tram){tram.t+=(tram.away?-1:1)*dt*(.02+.07*tram.t);tram.spark=Math.random()<dt*.6?1:Math.max(0,tram.spark-dt*5);if(tram.t<0||tram.t>1.1)tram=null}
  // the mist comes back slowly, unevenly (in half-second steps so 8-bit alpha keeps moving)
  st.refill+=dt;if(st.refill>.5){st.refill=0;kx.globalCompositeOperation='source-over';kx.globalAlpha=.022;kx.drawImage(noise,(Math.random()-.5)*8,(Math.random()-.5)*8);kx.globalAlpha=1;kx.fillStyle='rgba(255,255,255,.016)';kx.fillRect(0,0,mask.width,mask.height)}

  drawView();
  ctx.globalCompositeOperation='source-over';ctx.drawImage(bg,0,0);
  drawGlass();
  const gb=fd()*8*S;
  if(gb>.6&&FILTER_OK){ctx.filter=`blur(${gb.toFixed(1)}px)`;ctx.drawImage(glass,0,0);ctx.filter='none'}else{ctx.globalAlpha=gb>.6?.55:1;ctx.drawImage(glass,0,0);ctx.globalAlpha=1}
  // the mist: what is behind, very soft and milky, kept only where the mask says
  fx.globalCompositeOperation='source-over';fx.clearRect(0,0,fog.width,fog.height);
  if(FILTER_OK)fx.filter='blur(2.5px)';fx.drawImage(cv,0,0,fog.width,fog.height);fx.filter='none';
  fx.fillStyle='rgba(128,116,128,.42)';fx.fillRect(0,0,fog.width,fog.height);
  fx.globalAlpha=.14;fx.drawImage(noise,0,0);fx.globalAlpha=1;
  fx.globalCompositeOperation='destination-in';fx.drawImage(mask,0,0);fx.globalCompositeOperation='source-over';
  ctx.globalAlpha=.9;ctx.drawImage(fog,0,0,W,H);ctx.globalAlpha=1;
  ctx.drawImage(vign,0,0);
  if(ptr.seen){ctx.globalCompositeOperation='lighter';const R=(ptr.down?60:80)*S,g=ctx.createRadialGradient(ptr.x,ptr.y,0,ptr.x,ptr.y,R);
    g.addColorStop(0,'rgba(255,214,160,.45)');g.addColorStop(.22,'rgba(255,190,120,.16)');g.addColorStop(1,'rgba(255,170,100,0)');ctx.fillStyle=g;ctx.fillRect(ptr.x-R,ptr.y-R,2*R,2*R);
    ctx.fillStyle='rgba(255,244,225,.95)';ctx.beginPath();ctx.arc(ptr.x,ptr.y,2.6*S,0,TAU);ctx.fill();ctx.globalCompositeOperation='source-over'}
  requestAnimationFrame(frame);
}

// ---------- input ----------
const hint=document.getElementById('hint'),fs=document.getElementById('focus'),rs=document.getElementById('rain');
function pos(e){const k=W/innerWidth;ptr.x=e.clientX*k;ptr.y=e.clientY*k;ptr.seen=true}
function wipe(){kx.globalCompositeOperation='destination-out';kx.lineCap='round';kx.lineJoin='round';kx.strokeStyle='rgba(0,0,0,.92)';kx.lineWidth=30*S/FS;
  kx.beginPath();kx.moveTo(ptr.lx/FS,ptr.ly/FS);kx.lineTo(ptr.x/FS+.01,ptr.y/FS);kx.stroke();kx.globalCompositeOperation='source-over';ptr.lx=ptr.x;ptr.ly=ptr.y;
  if(!st.wiped){st.wiped=true;hint.style.opacity=0}}
cv.addEventListener('pointerdown',e=>{pos(e);ptr.down=true;ptr.lx=ptr.x;ptr.ly=ptr.y;try{cv.setPointerCapture(e.pointerId)}catch(_){}wipe()});
cv.addEventListener('pointermove',e=>{pos(e);if(ptr.down)wipe()});
const up=()=>{ptr.down=false};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();st.focusT=clamp(st.focusT+e.deltaY*.0011,0,1);fs.value=Math.round(st.focusT*1000)},{passive:false});
fs.addEventListener('input',()=>st.focusT=fs.value/1000);rs.addEventListener('input',()=>st.rain=rs.value/1000);
document.getElementById('refog').onclick=()=>{kx.globalCompositeOperation='source-over';kx.fillStyle='#fff';kx.fillRect(0,0,mask.width,mask.height)};
document.getElementById('clear').onclick=()=>{kx.clearRect(0,0,mask.width,mask.height)};
document.getElementById('min').onclick=e=>{const p=document.getElementById('panel');p.classList.toggle('min');e.target.textContent=p.classList.contains('min')?'Развернуть':'Свернуть'};
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(build,200)});
build();requestAnimationFrame(frame);
})();
</script>
